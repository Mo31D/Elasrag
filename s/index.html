<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sozan Apps</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4f8;
      --card: rgba(255,255,255,.88);
      --text: #241d27;
      --muted: #746b78;
      --accent: #7a3d72;
      --accent-dark: #5d2c57;
      --line: rgba(86,55,82,.12);
      --shadow: 0 18px 55px rgba(60,35,57,.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(173,112,163,.16), transparent 32rem),
        radial-gradient(circle at 90% 90%, rgba(122,61,114,.10), transparent 30rem),
        var(--bg);
    }

    main {
      width: min(760px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .intro {
      margin: 14px auto 34px;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .choice {
      display: flex;
      min-height: 210px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 30px 24px;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .choice:hover,
    .choice:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(122,61,114,.32);
      box-shadow: 0 24px 64px rgba(60,35,57,.17);
      outline: none;
    }

    .number {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(122,61,114,.22);
    }

    .choice strong {
      font-size: 25px;
      letter-spacing: -.02em;
    }

    .choice span:last-child {
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 26px;
      color: #948b97;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 160px; }
      .intro { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Sozan</p>
    <h1>اختاري البرنامج</h1>
    <p class="intro">اختاري النسخة التي تريدين فتحها.</p>

    <section class="choices" aria-label="اختيار تطبيق سوزان">
      <a class="choice" href="https://sozan-tutor-os.ky6vfb55p9.workers.dev/">
        <span class="number">1</span>
        <strong>Sozan</strong>
        <span>النسخة الأولى</span>
      </a>

      <a class="choice" href="https://sozan2.ky6vfb55p9.workers.dev/">
        <span class="number">2</span>
        <strong>Sozan2</strong>
        <span>النسخة الثانية</span>
      </a>
    </section>

    <footer>elasrag.com/s</footer>
  </main>
</body>
</html>
