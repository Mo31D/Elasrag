name: Lakeland Rush PR checks
on:
  pull_request:
    paths:
      - 'LakelandRush/**'
      - '.github/workflows/lakeland-rush-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LakelandRush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: node --import tsx --test src/{geo,game}/*.test.ts
      - run: npm run build -- --base=/LakelandRush/
