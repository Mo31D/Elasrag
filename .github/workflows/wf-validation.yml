name: WF Companion validation

on:
  push:
    branches: [main]
    paths:
      - 'wf/**'
      - 'wf-backend/**'
      - '.github/workflows/wf-validation.yml'
  pull_request:
    paths:
      - 'wf/**'
      - 'wf-backend/**'
      - '.github/workflows/wf-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wf-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wf-backend/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix wf-backend
      - name: Backend, frontend and hosting tests
        run: npm --prefix wf-backend run check
      - name: Bundle Cloudflare Worker without publishing
        working-directory: wf-backend
        run: npx wrangler deploy --dry-run --outdir /tmp/wf-build-check
      - name: Find headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$BROWSER" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y chromium
            BROWSER="$(command -v chromium)"
          fi
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
      - name: Mobile layout and bilingual safety flows
        env:
          WF_TEST_CHROMIUM: ${{ steps.browser.outputs.path }}
        run: npm --prefix wf-backend run test:mobile
      - name: Compare public Cloudflare build with repository
        if: always()
        shell: bash
        run: |
          EXPECTED="$(node --input-type=module -e 'import { WF_BUILD } from "./wf/build.js"; process.stdout.write(WF_BUILD)')"
          HEADERS="$(curl -fsSIL --max-time 15 https://mo.elasrag.com/ || true)"
          LIVE="$(printf '%s\n' "$HEADERS" | tr -d '\r' | awk -F': *' 'tolower($1)=="x-wf-build" {print $2}' | tail -1)"
          LIVE_HTML="$(curl -fsSL --max-time 15 https://mo.elasrag.com/ || true)"
          LIVE_BUILD_JS="$(curl -fsSL --max-time 15 https://mo.elasrag.com/build.js || true)"
          HTML_OK=false
          BUILD_OK=false
          if [[ "$LIVE_HTML" == *'data-page="safety/substances"'* ]]; then HTML_OK=true; fi
          if [[ "$LIVE_BUILD_JS" == *"WF_BUILD = \"$EXPECTED\""* ]]; then BUILD_OK=true; fi
          echo "Live probe: expected=$EXPECTED observed=${LIVE:-unavailable} html_bytes=${#LIVE_HTML} html=$HTML_OK build_module=$BUILD_OK" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$LIVE" ] && [ "$LIVE" = "$EXPECTED" ] && [ "$HTML_OK" = true ] && [ "$BUILD_OK" = true ]; then
            echo "Cloudflare origin verified: build $LIVE, latest HTML quick action and build.js all match." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Live Cloudflare build or contents not confirmed: expected $EXPECTED, observed ${LIVE:-unavailable}, html=$HTML_OK, build.js=$BUILD_OK."
            echo "Live Cloudflare validation mismatch: expected $EXPECTED, observed ${LIVE:-unavailable}, html=$HTML_OK, build.js=$BUILD_OK." >> "$GITHUB_STEP_SUMMARY"
          fi
