name: Publish compiled Adam Adventure site

on:
  push:
    branches: [main]
    paths:
      - 'adam/game/src/**'
      - 'adam/game/public/**'
      - 'adam/game/stage.mjs'
      - 'adam/game/index.html'
      - 'adam/game/package.json'
      - 'adam/game/package-lock.json'
      - '.github/workflows/adam-site-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-source-build-main
  cancel-in-progress: false

jobs:
  publish-compiled-assets:
    if: github.repository == 'Mo31D/Elasrag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adam/game/package-lock.json
      - name: Install and verify application
        run: |
          npm ci --prefix adam/game
          npm --prefix adam/game test
      - name: Build and stage production site
        run: npm --prefix adam/game run build
      - name: Commit only built Adam website outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adam/index.html adam/assets adam/audio adam/data adam/shared
          if git diff --cached --quiet; then
            echo "Compiled site already matches main."
            exit 0
          fi
          git commit -m "build(adam): publish verified game bundles"
          # Never force push over changes made by Work or another contributor.
          git push origin HEAD:main
