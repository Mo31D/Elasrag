<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15285f" />
  <meta name="color-scheme" content="dark" />
  <title>Elasrag</title>
  <meta name="description" content="Elasrag" />

  <style>
    :root {
      --mx: 0;
      --my: 0;
      --bg-a: #102c61;
      --bg-b: #22265e;
      --bg-c: #45286e;
      --bg-d: #0c5b78;
      --white: rgba(255,255,255,.96);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      color: var(--white);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        "Noto Sans Arabic",
        "Noto Sans",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      background:
        radial-gradient(circle at 22% 18%, rgba(90, 132, 255, .75), transparent 33%),
        radial-gradient(circle at 78% 26%, rgba(167, 76, 255, .62), transparent 34%),
        radial-gradient(circle at 52% 82%, rgba(0, 223, 255, .42), transparent 36%),
        linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 38%, var(--bg-c) 69%, var(--bg-d) 100%);
      isolation: isolate;
    }

    .scene {
      position: fixed;
      inset: -8%;
      overflow: hidden;
      perspective: 1200px;
      transform-style: preserve-3d;
      background:
        radial-gradient(circle at 50% 46%, rgba(154, 211, 255, .12), transparent 23%),
        linear-gradient(120deg, rgba(255,255,255,.025), transparent 42%, rgba(255,255,255,.035));
    }

    .depth {
      position: absolute;
      inset: -14%;
      pointer-events: none;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .depth.far {
      transform:
        translate3d(
          calc(var(--mx) * -10px),
          calc(var(--my) * -8px),
          -180px
        )
        scale(1.18);
    }

    .depth.mid {
      transform:
        translate3d(
          calc(var(--mx) * -20px),
          calc(var(--my) * -16px),
          -70px
        )
        scale(1.08);
    }

    .depth.near {
      transform:
        translate3d(
          calc(var(--mx) * -34px),
          calc(var(--my) * -28px),
          55px
        )
        scale(1.02);
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(62px);
      mix-blend-mode: screen;
      opacity: .9;
      will-change: transform;
    }

    .aurora.a {
      width: 62vmax;
      height: 42vmax;
      left: -13vmax;
      top: -15vmax;
      background:
        radial-gradient(ellipse at 38% 45%, rgba(69, 186, 255, .74), rgba(79, 78, 255, .34) 41%, transparent 72%);
      animation: aurora-a 14s ease-in-out infinite alternate;
    }

    .aurora.b {
      width: 58vmax;
      height: 46vmax;
      right: -15vmax;
      top: 2vmax;
      background:
        radial-gradient(ellipse at 55% 50%, rgba(203, 87, 255, .67), rgba(105, 71, 255, .28) 43%, transparent 74%);
      animation: aurora-b 18s ease-in-out infinite alternate;
    }

    .aurora.c {
      width: 62vmax;
      height: 40vmax;
      left: 20%;
      bottom: -22vmax;
      background:
        radial-gradient(ellipse at center, rgba(0, 235, 255, .56), rgba(53, 142, 255, .22) 46%, transparent 75%);
      animation: aurora-c 16s ease-in-out infinite alternate;
    }

    .ribbon {
      position: absolute;
      width: 86vmax;
      height: 24vmax;
      left: 8%;
      top: 42%;
      border-radius: 50%;
      border: 1px solid rgba(203, 232, 255, .19);
      box-shadow:
        0 0 50px rgba(101, 192, 255, .11),
        inset 0 0 52px rgba(111, 160, 255, .08);
      transform: rotate(-16deg) rotateX(70deg);
      filter: blur(.15px);
      opacity: .66;
      animation: ribbon 15s ease-in-out infinite alternate;
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      inset: 8%;
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 0 38px rgba(135, 107, 255, .13);
    }

    .ribbon::after {
      inset: 19%;
      opacity: .65;
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(68vw, 880px);
      aspect-ratio: 1.6 / 1;
      transform: translate(-50%, -50%) rotateX(66deg);
      border-radius: 50%;
      border: 1px solid rgba(207, 236, 255, .22);
      box-shadow:
        0 0 44px rgba(61, 196, 255, .18),
        0 0 100px rgba(95, 86, 255, .13),
        inset 0 0 70px rgba(255,255,255,.06);
      opacity: .72;
      animation: halo 8s ease-in-out infinite;
    }

    .light-streak {
      position: absolute;
      width: 54vw;
      height: 2px;
      left: 23vw;
      top: 49%;
      transform: rotate(-14deg);
      background:
        linear-gradient(90deg, transparent, rgba(135, 229, 255, .02), rgba(214, 243, 255, .78), rgba(159, 117, 255, .48), transparent);
      box-shadow:
        0 0 12px rgba(173, 226, 255, .55),
        0 0 34px rgba(87, 123, 255, .28);
      filter: blur(.3px);
      opacity: .5;
      animation: streak 7s ease-in-out infinite;
    }

    .mesh {
      position: absolute;
      inset: -32%;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 70px 70px;
      transform: perspective(650px) rotateX(69deg) translateY(23%);
      transform-origin: center;
      mask-image: radial-gradient(ellipse at center, black 5%, transparent 66%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 5%, transparent 66%);
      animation: mesh-float 13s ease-in-out infinite alternate;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: .055;
      mix-blend-mode: soft-light;
      background-image:
        repeating-radial-gradient(circle at 0 0, rgba(255,255,255,.6) 0 1px, transparent 1px 4px);
      background-size: 7px 7px;
      pointer-events: none;
    }

    .soft-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 28%, rgba(17, 28, 74, .08) 58%, rgba(21, 26, 76, .26) 100%);
      pointer-events: none;
    }

    #particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .brand {
      position: fixed;
      z-index: 20;
      top: max(30px, calc(env(safe-area-inset-top) + 22px));
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      white-space: nowrap;
      font-size: clamp(18px, 1.45vw, 24px);
      font-weight: 580;
      letter-spacing: .015em;
      color: rgba(255,255,255,.94);
      text-shadow:
        0 0 15px rgba(190, 226, 255, .28),
        0 0 36px rgba(105, 133, 255, .18);
      user-select: none;
      direction: ltr;
      transition:
        opacity .62s cubic-bezier(.22,.7,.18,1),
        transform .75s cubic-bezier(.22,.7,.18,1),
        filter .65s ease,
        letter-spacing .75s cubic-bezier(.22,.7,.18,1);
      will-change: opacity, transform, filter;
    }

    .brand.switching {
      opacity: 0;
      transform: translate(-50%, -6px) scale(.975);
      filter: blur(8px);
      letter-spacing: .1em;
    }

    .brand::after {
      content: "";
      display: block;
      width: 30px;
      height: 1px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, rgba(230,245,255,.66), transparent);
      box-shadow: 0 0 14px rgba(142, 205, 255, .5);
    }

    main {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      perspective: 1000px;
    }

    .hello-wrap {
      position: relative;
      width: min(94vw, 1240px);
      min-height: 240px;
      display: grid;
      place-items: center;
      text-align: center;
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .core-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 860px);
      aspect-ratio: 1.7 / 1;
      transform:
        translate(-50%, -50%)
        translate3d(
          calc(var(--mx) * 8px),
          calc(var(--my) * 7px),
          -90px
        );
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center,
          rgba(224, 246, 255, .30) 0%,
          rgba(106, 201, 255, .18) 18%,
          rgba(113, 90, 255, .12) 42%,
          transparent 70%);
      filter: blur(30px);
      animation: core-pulse 5.2s ease-in-out infinite;
      pointer-events: none;
    }

    .greeting {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      max-width: 94vw;
      padding: .08em .18em .18em;
      transform:
        translate(-50%, -50%)
        translateZ(70px)
        scale(1);
      transform-origin: center;
      font-size: clamp(60px, 11.2vw, 158px);
      line-height: .98;
      font-weight: 610;
      letter-spacing: -.055em;
      white-space: nowrap;
      color: transparent;
      background:
        linear-gradient(
          112deg,
          rgba(237,248,255,.88) 0%,
          #ffffff 22%,
          #b8e8ff 44%,
          #ffffff 61%,
          #d6c6ff 80%,
          rgba(255,255,255,.9) 100%
        );
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: none;
      filter:
        drop-shadow(0 0 12px rgba(190, 230, 255, .24))
        drop-shadow(0 0 38px rgba(96, 131, 255, .22));
      opacity: 0;
      transition:
        opacity 1.08s cubic-bezier(.22,.74,.18,1),
        transform 1.24s cubic-bezier(.2,.76,.16,1),
        filter 1.12s ease;
      animation: text-sheen 6.8s linear infinite;
      will-change: opacity, transform, filter;
      transform-style: preserve-3d;
    }

    .greeting.is-active {
      opacity: 1;
      transform:
        translate(-50%, -50%)
        translate3d(
          calc(var(--mx) * 5px),
          calc(var(--my) * 4px),
          72px
        )
        scale(1);
      filter:
        blur(0)
        drop-shadow(0 0 13px rgba(190, 230, 255, .26))
        drop-shadow(0 0 42px rgba(92, 122, 255, .24));
    }

    .greeting.is-leaving {
      opacity: 0;
      transform:
        translate(-50%, -50%)
        translate3d(
          calc(var(--mx) * -4px),
          calc(var(--my) * -3px),
          16px
        )
        scale(1.025);
      filter:
        blur(14px)
        drop-shadow(0 0 36px rgba(120, 172, 255, .2));
    }

    .greeting.is-entering {
      opacity: 0;
      transform:
        translate(-50%, -50%)
        translate3d(
          calc(var(--mx) * 7px),
          calc(var(--my) * 6px),
          130px
        )
        scale(.965);
      filter:
        blur(15px)
        drop-shadow(0 0 30px rgba(145, 210, 255, .2));
    }

    @keyframes aurora-a {
      0%   { transform: translate3d(0,0,0) rotate(-4deg) scale(1); }
      100% { transform: translate3d(15vmax,7vmax,0) rotate(10deg) scale(1.12); }
    }

    @keyframes aurora-b {
      0%   { transform: translate3d(0,0,0) rotate(7deg) scale(1.05); }
      100% { transform: translate3d(-13vmax,9vmax,0) rotate(-9deg) scale(1.18); }
    }

    @keyframes aurora-c {
      0%   { transform: translate3d(-5vmax,0,0) scale(1); }
      100% { transform: translate3d(8vmax,-9vmax,0) scale(1.16); }
    }

    @keyframes ribbon {
      from { transform: rotate(-17deg) rotateX(68deg) translate3d(-2%,0,0) scale(.98); opacity: .48; }
      to   { transform: rotate(-12deg) rotateX(74deg) translate3d(4%,-3%,0) scale(1.06); opacity: .78; }
    }

    @keyframes halo {
      0%,100% { opacity: .46; transform: translate(-50%,-50%) rotateX(66deg) scale(.93); }
      50%     { opacity: .82; transform: translate(-50%,-50%) rotateX(70deg) scale(1.07); }
    }

    @keyframes streak {
      0%,100% { opacity: .18; transform: rotate(-14deg) translateX(-7%); }
      50%     { opacity: .72; transform: rotate(-14deg) translateX(7%); }
    }

    @keyframes mesh-float {
      from { transform: perspective(650px) rotateX(69deg) translateY(23%) translateX(-1.5%); }
      to   { transform: perspective(650px) rotateX(69deg) translateY(19%) translateX(1.5%); }
    }

    @keyframes core-pulse {
      0%,100% { opacity: .68; scale: .94; }
      50%     { opacity: 1; scale: 1.08; }
    }

    @keyframes text-sheen {
      from { background-position: 130% 0; }
      to   { background-position: -130% 0; }
    }

    @media (max-width: 720px) {
      .scene { inset: -12%; }

      .hello-wrap {
        min-height: 190px;
      }

      .greeting {
        font-size: clamp(52px, 17vw, 106px);
        letter-spacing: -.06em;
      }

      .mesh {
        background-size: 52px 52px;
        opacity: .12;
      }

      .ribbon {
        width: 120vmax;
        left: -10%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora,
      .ribbon,
      .halo,
      .light-streak,
      .mesh,
      .core-glow,
      .greeting {
        animation: none !important;
      }

      .brand,
      .greeting {
        transition-duration: .01ms !important;
      }

      .depth,
      .core-glow,
      .greeting.is-active {
        transform: translate(-50%, -50%) !important;
      }

      #particles {
        opacity: .36;
      }
    }
  </style>
</head>

<body>
  <div class="scene" aria-hidden="true">
    <div class="depth far">
      <div class="aurora a"></div>
      <div class="aurora b"></div>
      <div class="aurora c"></div>
    </div>

    <div class="depth mid">
      <div class="mesh"></div>
      <div class="ribbon"></div>
      <div class="halo"></div>
    </div>

    <div class="depth near">
      <div class="light-streak"></div>
    </div>

    <canvas id="particles"></canvas>
    <div class="grain"></div>
    <div class="soft-vignette"></div>
  </div>

  <div id="brand" class="brand">Elasrag</div>

  <main aria-label="Welcome">
    <div class="hello-wrap">
      <div class="core-glow" aria-hidden="true"></div>
      <div id="greetingA" class="greeting is-active" role="status" aria-live="polite">مرحبًا</div>
      <div id="greetingB" class="greeting is-entering" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    (() => {
      const greetings = [
        { text: "مرحبًا", dir: "rtl" },
        { text: "Hello", dir: "ltr" },
        { text: "Bonjour", dir: "ltr" },
        { text: "Hola", dir: "ltr" },
        { text: "Ciao", dir: "ltr" },
        { text: "Hallo", dir: "ltr" },
        { text: "Cześć", dir: "ltr" },
        { text: "Olá", dir: "ltr" },
        { text: "Привет", dir: "ltr" },
        { text: "Вітаю", dir: "ltr" },
        { text: "Merhaba", dir: "ltr" },
        { text: "Γεια σου", dir: "ltr" },
        { text: "שלום", dir: "rtl" },
        { text: "سلام", dir: "rtl" },
        { text: "नमस्ते", dir: "ltr" },
        { text: "নমস্কার", dir: "ltr" },
        { text: "你好", dir: "ltr" },
        { text: "こんにちは", dir: "ltr" },
        { text: "안녕하세요", dir: "ltr" },
        { text: "สวัสดี", dir: "ltr" },
        { text: "Xin chào", dir: "ltr" },
        { text: "Halo", dir: "ltr" },
        { text: "Hai", dir: "ltr" },
        { text: "Kumusta", dir: "ltr" },
        { text: "Jambo", dir: "ltr" },
        { text: "Salut", dir: "ltr" },
        { text: "Ahoj", dir: "ltr" },
        { text: "Helló", dir: "ltr" },
        { text: "Hej", dir: "ltr" },
        { text: "Hei", dir: "ltr" },
        { text: "Hej", dir: "ltr" },
        { text: "Hei", dir: "ltr" },
        { text: "Hallo", dir: "ltr" },
        { text: "გამარჯობა", dir: "ltr" },
        { text: "Բարև", dir: "ltr" }
      ];

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const root = document.documentElement;
      const brand = document.getElementById("brand");
      const greetingA = document.getElementById("greetingA");
      const greetingB = document.getElementById("greetingB");
      const layers = [greetingA, greetingB];
      const brandNames = ["Elasrag", "Mo"];

      let brandIndex = 0;
      let greetingIndex = 0;
      let activeLayer = 0;

      function fitLayer(el) {
        el.style.fontSize = "";
        const maxWidth = Math.min(window.innerWidth * .92, 1200);
        const computed = parseFloat(getComputedStyle(el).fontSize);

        if (el.scrollWidth > maxWidth) {
          el.style.fontSize = Math.max(38, computed * (maxWidth / el.scrollWidth)) + "px";
        }
      }

      function switchBrand() {
        brand.classList.add("switching");

        window.setTimeout(() => {
          brandIndex = (brandIndex + 1) % brandNames.length;
          brand.textContent = brandNames[brandIndex];
          brand.classList.remove("switching");
        }, 620);
      }

      function switchGreeting() {
        const current = layers[activeLayer];
        const next = layers[1 - activeLayer];
        greetingIndex = (greetingIndex + 1) % greetings.length;
        const item = greetings[greetingIndex];

        next.textContent = item.text;
        next.dir = item.dir;
        next.className = "greeting is-entering";
        fitLayer(next);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            current.className = "greeting is-leaving";
            next.className = "greeting is-active";

            window.setTimeout(() => {
              current.className = "greeting is-entering";
              current.textContent = "";
            }, 1250);

            activeLayer = 1 - activeLayer;
          });
        });
      }

      fitLayer(greetingA);

      window.addEventListener("resize", () => {
        fitLayer(layers[activeLayer]);
      }, { passive: true });

      if (!reduceMotion) {
        window.setInterval(switchBrand, 3000);
        window.setInterval(switchGreeting, 2800);
      }

      function setPointer(x, y) {
        const nx = (x / window.innerWidth - .5) * 2;
        const ny = (y / window.innerHeight - .5) * 2;
        root.style.setProperty("--mx", nx.toFixed(3));
        root.style.setProperty("--my", ny.toFixed(3));
      }

      window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY), { passive: true });

      window.addEventListener("deviceorientation", e => {
        if (e.gamma == null || e.beta == null) return;
        const x = Math.max(-1, Math.min(1, e.gamma / 35));
        const y = Math.max(-1, Math.min(1, (e.beta - 45) / 45));
        root.style.setProperty("--mx", x.toFixed(3));
        root.style.setProperty("--my", y.toFixed(3));
      }, { passive: true });

      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d", { alpha: true });

      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let pointer = { x: 0, y: 0, active: false };

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.max(32, Math.min(72, Math.floor((width * height) / 21000)));

        particles = Array.from({ length: count }, () => {
          const z = Math.random();
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            z,
            vx: (Math.random() - .5) * (.08 + z * .22),
            vy: (Math.random() - .5) * (.08 + z * .22),
            r: .4 + z * 2.05,
            pulse: Math.random() * Math.PI * 2
          };
        });
      }

      function drawParticles(time) {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;
          p.pulse += .01 + p.z * .018;

          if (p.x < -30) p.x = width + 30;
          if (p.x > width + 30) p.x = -30;
          if (p.y < -30) p.y = height + 30;
          if (p.y > height + 30) p.y = -30;

          const parallaxX = pointer.active ? (pointer.x - width / 2) * p.z * .018 : 0;
          const parallaxY = pointer.active ? (pointer.y - height / 2) * p.z * .018 : 0;
          const px = p.x - parallaxX;
          const py = p.y - parallaxY;

          for (let j = i + 1; j < particles.length; j++) {
            const q = particles[j];
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const dist2 = dx * dx + dy * dy;
            const max = 80 + ((p.z + q.z) * 42);

            if (dist2 < max * max && Math.abs(p.z - q.z) < .34) {
              const dist = Math.sqrt(dist2);
              const alpha = (1 - dist / max) * (.025 + ((p.z + q.z) * .055));
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(q.x - parallaxX * q.z, q.y - parallaxY * q.z);
              ctx.strokeStyle = "rgba(196, 228, 255, " + alpha.toFixed(3) + ")";
              ctx.lineWidth = .45 + p.z * .5;
              ctx.stroke();
            }
          }

          const twinkle = .52 + Math.sin(p.pulse + time * .00035) * .25;
          const alpha = (.24 + p.z * .58) * twinkle;

          if (p.z > .68) {
            const gradient = ctx.createRadialGradient(px, py, 0, px, py, p.r * 5.5);
            gradient.addColorStop(0, "rgba(235,248,255," + Math.min(.9, alpha + .2).toFixed(3) + ")");
            gradient.addColorStop(.22, "rgba(151,217,255," + (alpha * .72).toFixed(3) + ")");
            gradient.addColorStop(1, "rgba(101,102,255,0)");
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(px, py, p.r * 5.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(px, py, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(226,244,255," + Math.min(.94, alpha).toFixed(3) + ")";
          ctx.fill();
        }

        if (!reduceMotion) requestAnimationFrame(drawParticles);
      }

      resizeCanvas();

      if (reduceMotion) {
        drawParticles(0);
      } else {
        requestAnimationFrame(drawParticles);
      }

      window.addEventListener("resize", resizeCanvas, { passive: true });

      window.addEventListener("pointermove", e => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        pointer.active = false;
      }, { passive: true });
    })();
  </script>
</body>
</html>
