<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">شجرة ترمز لاستمرارية عائلة الأسرج</title>
<desc id="d">منظر طبيعي هادئ بخطوط بسيطة وشجرة وحيدة.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
