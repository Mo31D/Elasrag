  </linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d8ddd8"/>
    <stop offset=".55" stop-color="#c4cec7"/>
    <stop offset="1" stop-color="#aab8ad"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
